[project]
name = "redline-factory"
version = "0.1.0"
description = "Redline: a tests-first dark factory for BAND"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
band = ["band-sdk[opencode,claude-sdk]>=4.0"]
ui = ["playwright>=1.45"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["factory*"]
exclude = ["factory.tests*"]

[tool.setuptools.package-data]
factory = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["factory/tests"]
