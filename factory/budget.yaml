# Caps the governor enforces from ledger data. When one trips, the work item
# returns to the planner with the evidence; it never comes to a human.
node:
  attempts: 4        # rejections (NEEDS_WORK / BLOCK / BREACH) before it returns to the planner
  minutes: 90        # wall time since the item was dispatched
  tokens: 600000
  usd: 15
stage:
  minutes: 900        # raised from 480 during the official run: host outages and an operator pause took ~4.5 h of one stage clock
  usd: 120
